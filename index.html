<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Rock, Paper, Scissors</title>
    <!-- Step 1 -->
    <section>
      <div class="topNav">
        <div class="logo">
          <img src="./images/logo.svg" alt="logo" />
        </div>

        <div class="scoreboard">
          <p>Score</p>
          <h1 id="score">12</h1>
        </div>
      </div>

      <div class="userRole">
        <div class="Paper">
          <img src="./images/icon-paper.svg" alt="Paper Hand Sign" />
        </div>

        <div class="Rock">
          <img src="./images/icon-rock.svg" alt="Rock Hand Sign" />
        </div>

        <div class="Scissors">
          <img src="./images/icon-scissors.svg" alt="Scissors Hand Sign" />
        </div>
      </div>

      <div class="rules">
        <p>RULES</p>
      </div>
    </section>

    <!-- Step 2 -->
     <section class="picked unpicked">
      <div class="userChoice">
        <p>You Picked</p>
      </div>
      <div class="win-lose">
        <h1>You</h1>
        <button type="button" id="playagain">PLAY AGAIN</button>
      </div>
      <div class="houseChoice">
        <p>The House Picked</p>
        <div class="skeleton"></div>
      </div>
      
     </section>
    
  

    <!-- 

  You Win
  You Lose

  Play Again -->

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
     
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
